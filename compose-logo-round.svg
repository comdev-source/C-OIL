<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Outer dark ring -->
  <circle cx="250" cy="250" r="240" fill="#221E1F" />
  <!-- Yellow main circle -->
  <circle cx="250" cy="250" r="220" fill="#F4C400" />
  
  <!-- Outer text "COMPOSE" -->
  <path id="textArcTop" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
  <!-- Outer text "COFFEE" -->
  <path id="textArcBottom" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
  
  <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="54" fill="#221E1F" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">COMPOSE</textPath>
  </text>
  <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="54" fill="#221E1F" letter-spacing="6">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">COFFEE</textPath>
  </text>

  <!-- Inner dark C-shape background -->
  <path d="M 465 250 A 215 215 0 1 0 465 250.01" fill="none" />
  <!-- Center Dark Circle with C Cutout -->
  <path d="M 250 130 A 120 120 0 1 0 470 250 L 370 250 A 120 120 0 0 1 250 130 Z" fill="#221E1F" />
  
  <!-- Center Dark Circle -->
  <circle cx="250" cy="250" r="120" fill="#221E1F" />

  <!-- Compass Diamond Blade -->
  <g transform="rotate(-30 250 250)">
    <polygon points="250,155 305,250 250,345 195,250" fill="#F4C400" />
    <circle cx="250" cy="250" r="18" fill="#221E1F" />
  </g>
</svg>
